name: Database Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy migrations'
        required: true
        type: choice
        options:
          - production
          - staging
          - development

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # This workflow is now the ONLY path that applies migrations. It used to
      # be a backstop, because vercel.json's buildCommand ran `prisma migrate
      # deploy` on every production build; that coupling is gone, so a
      # migration reaches the database if and only if someone runs this.
      #
      # It fails closed on missing secrets rather than letting Prisma report
      # P1013 ("the provided database string is invalid") several steps later.
      # That error is what an unset secret looks like, and it reads like a
      # malformed URL rather than an absent one — worth naming explicitly,
      # because DATABASE_URL and DIRECT_URL are Sensitive in Vercel and cannot
      # be pulled from there. They have to be copied from the Supabase
      # dashboard (Settings -> Database -> Connection string, session mode).
      - name: Verify migration secrets are present
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          PROD_DB: ${{ secrets.DATABASE_URL }}
          PROD_DIRECT: ${{ secrets.DIRECT_URL }}
          STAGING_DB: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DIRECT: ${{ secrets.STAGING_DIRECT_URL }}
          DEV_DB: ${{ secrets.DEV_DATABASE_URL }}
          DEV_DIRECT: ${{ secrets.DEV_DIRECT_URL }}
        run: |
          # Each environment is checked against the two secrets the matching
          # migration step below actually consumes. Previously staging and dev
          # assigned NEEDED_DIRECT from the *database* secret, so their
          # DIRECT_URL was never validated at all — the guard passed and Prisma
          # then failed on the empty variable, which is the exact failure this
          # step exists to prevent.
          case "$ENVIRONMENT" in
            production) DB="$PROD_DB";    DIRECT="$PROD_DIRECT";    DB_NAME=DATABASE_URL;         DIRECT_NAME=DIRECT_URL ;;
            staging)    DB="$STAGING_DB"; DIRECT="$STAGING_DIRECT"; DB_NAME=STAGING_DATABASE_URL; DIRECT_NAME=STAGING_DIRECT_URL ;;
            *)          DB="$DEV_DB";     DIRECT="$DEV_DIRECT";     DB_NAME=DEV_DATABASE_URL;     DIRECT_NAME=DEV_DIRECT_URL ;;
          esac

          # Report the variable that is actually empty. Naming both on any
          # failure sends you to re-set a secret that was already fine.
          missing=""
          [ -n "$DB" ]     || missing="$missing $DB_NAME"
          [ -n "$DIRECT" ] || missing="$missing $DIRECT_NAME"

          if [ -n "$missing" ]; then
            for name in $missing; do
              echo "::error::Secret '$name' is empty or not set for environment '$ENVIRONMENT'"
            done
            echo "::error::Note: a secret can appear in 'gh secret list' while holding an empty value — being listed is not proof it has content."
            echo "::error::Set each with: gh secret set <NAME>   (Supabase dashboard -> Database -> Connection string -> Session pooler, port 5432)"
            exit 1
          fi

          echo "Secrets present for '$ENVIRONMENT': $DB_NAME, $DIRECT_NAME"

      - name: Run Prisma migrations (Production)
        if: github.event.inputs.environment == 'production'
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Run Prisma migrations (Staging)
        if: github.event.inputs.environment == 'staging'
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}

      - name: Run Prisma migrations (Development)
        if: github.event.inputs.environment == 'development'
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DEV_DIRECT_URL }}

      - name: Generate Prisma Client
        # `prisma generate` never connects to a database, but prisma.config.ts
        # calls env("DATABASE_URL") eagerly, so it exits with
        # PrismaConfigEnvError when the variable is absent. This step was the
        # only one without an env block, which failed every run *after* the
        # migration had already applied cleanly — and took the Migration Status
        # check down with it, so a successful migration reported as a failure.
        #
        # Which database it points at does not matter here (nothing is
        # connected to); it just has to be present. The seed step below is why
        # the client is generated at all, so this cannot simply be dropped.
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.STAGING_DATABASE_URL || secrets.DEV_DATABASE_URL }}

      - name: Seed database (if requested)
        if: github.event.inputs.environment != 'production'
        run: npx prisma db seed
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Migration Status
        run: |
          echo "✅ Database migrations completed successfully for ${{ github.event.inputs.environment }}"
