name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder
          DIRECT_URL: postgresql://placeholder

      # Gates the build. Previously continue-on-error, which was reasonable
      # while eslint.config.mjs was broken and lint could not run at all — that
      # is fixed, lint is clean, so let it fail the build again.
      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript types
        run: npx tsc --noEmit

      # Unit tests need no database, but they are not free of configuration:
      # tests/unit/stripe-webhook-signature.test.ts imports the webhook route,
      # and src/lib/stripe.ts builds its client from STRIPE_SECRET_KEY at module
      # load. With the key absent the route short-circuits with 503 "Stripe is
      # not configured" before it ever reaches signature verification, so the
      # test asserting a 400 failed on every run. Placeholders are enough — the
      # Stripe SDK does not contact the network to construct a client, and the
      # signature check still runs for real.
      - name: Run unit tests
        run: npm run test:unit
        env:
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder

      - name: Build application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true
          DATABASE_URL: postgresql://placeholder
          DIRECT_URL: postgresql://placeholder
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: placeholder-secret-for-build
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder
          ANTHROPIC_API_KEY: placeholder

  # The credit/billing tests exercise real Prisma queries against a real
  # Postgres rather than mocks — they're what stands between a change to the
  # credit system and a customer being over- or under-charged. They create and
  # delete their own rows, so a throwaway database per run is sufficient.
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xantuus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Required before anything imports @/lib/prisma. lint-and-test has this
      # step; this job did not, and its db push passes --skip-generate, so the
      # client was never generated here. Every integration file then threw
      # "@prisma/client did not initialize yet" at import — before a single
      # assertion ran. That, not any test logic, is why this job kept failing.
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xantuus_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/xantuus_test

      # db push rather than migrate deploy: this database is thrown away after
      # the run, so we want the current schema, not migration replay.
      - name: Push schema to test database
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xantuus_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/xantuus_test

      # The subscription tests pick a tier via isPriceIdConfigured(), which only
      # requires a "price_" prefix. With no price ids in the environment every
      # tier resolves to null, `tier` comes back undefined, and the tests throw
      # on tier.priceIds.monthly. Two placeholders give them something to select:
      # one below the enterprise credit threshold and one at or above it, so both
      # the pro and enterprise mapping paths are exercised. These are
      # NEXT_PUBLIC_ values, not secrets.
      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xantuus_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/xantuus_test
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          NEXT_PUBLIC_STRIPE_12000_MONTHLY_PRICE_ID: price_test_pro_monthly
          NEXT_PUBLIC_STRIPE_40000_MONTHLY_PRICE_ID: price_test_enterprise_monthly
          # The margin report prices a request via aiRouter.getModel(), and the
          # router only registers a provider when that provider's key is set.
          # With no key the model list is empty, every lookup misses, and every
          # cost is 0 — which is what the margin assertions were comparing
          # against. No network call is made; the key only has to exist.
          ANTHROPIC_API_KEY: sk-ant-placeholder

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  # Deployment lives here, not in a separate workflow, so it can actually depend
  # on the test jobs. Previously vercel-deploy.yml ran in parallel with CI with
  # no relationship between them: production shipped on all 11 consecutive red
  # CI runs. `needs:` cannot cross workflow files, so the job had to move.
  deploy:
    needs: [lint-and-test, integration-tests]
    # Skip entirely on develop pushes — neither deploy step below would fire,
    # so building would just burn minutes.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel Production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel Preview
        if: github.event_name == 'pull_request'
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment PR with Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Preview deployment ready! Check the Vercel dashboard for the URL.'
            })
