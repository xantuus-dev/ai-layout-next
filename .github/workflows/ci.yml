name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder
          DIRECT_URL: postgresql://placeholder

      # Gates the build. Previously continue-on-error, which was reasonable
      # while eslint.config.mjs was broken and lint could not run at all — that
      # is fixed, lint is clean, so let it fail the build again.
      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript types
        run: npx tsc --noEmit

      # Unit tests need no database, but they are not free of configuration:
      # tests/unit/stripe-webhook-signature.test.ts imports the webhook route,
      # and src/lib/stripe.ts builds its client from STRIPE_SECRET_KEY at module
      # load. With the key absent the route short-circuits with 503 "Stripe is
      # not configured" before it ever reaches signature verification, so the
      # test asserting a 400 failed on every run. Placeholders are enough — the
      # Stripe SDK does not contact the network to construct a client, and the
      # signature check still runs for real.
      - name: Run unit tests
        run: npm run test:unit
        env:
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder

      - name: Build application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true
          DATABASE_URL: postgresql://placeholder
          DIRECT_URL: postgresql://placeholder
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: placeholder-secret-for-build
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder
          ANTHROPIC_API_KEY: placeholder

  # The credit/billing tests exercise real Prisma queries against a real
  # Postgres rather than mocks — they're what stands between a change to the
  # credit system and a customer being over- or under-charged. They create and
  # delete their own rows, so a throwaway database per run is sufficient.
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xantuus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # db push rather than migrate deploy: this database is thrown away after
      # the run, so we want the current schema, not migration replay.
      - name: Push schema to test database
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xantuus_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/xantuus_test

      # The subscription tests pick a tier via isPriceIdConfigured(), which only
      # requires a "price_" prefix. With no price ids in the environment every
      # tier resolves to null, `tier` comes back undefined, and the tests throw
      # on tier.priceIds.monthly. Two placeholders give them something to select:
      # one below the enterprise credit threshold and one at or above it, so both
      # the pro and enterprise mapping paths are exercised. These are
      # NEXT_PUBLIC_ values, not secrets.
      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xantuus_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/xantuus_test
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          NEXT_PUBLIC_STRIPE_12000_MONTHLY_PRICE_ID: price_test_pro_monthly
          NEXT_PUBLIC_STRIPE_40000_MONTHLY_PRICE_ID: price_test_enterprise_monthly

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true
