<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="docglow" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="doccard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bluebadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="chartbar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#0b0722"/>
  <ellipse cx="380" cy="230" rx="360" ry="240" fill="url(#docglow)"/>
  <!-- back card: report with chart -->
  <g transform="rotate(-7 570 210)">
    <rect x="470" y="90" width="200" height="250" rx="16" fill="url(#doccard)" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="490" y="115" width="110" height="14" rx="7" fill="#c4b5fd" opacity="0.9"/>
    <rect x="490" y="140" width="160" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
    <rect x="490" y="156" width="140" height="8" rx="4" fill="#ffffff" opacity="0.22"/>
    <!-- bar chart -->
    <rect x="492" y="250" width="24" height="60" rx="4" fill="url(#chartbar)" opacity="0.75"/>
    <rect x="526" y="228" width="24" height="82" rx="4" fill="url(#chartbar)" opacity="0.9"/>
    <rect x="560" y="205" width="24" height="105" rx="4" fill="url(#chartbar)"/>
    <rect x="594" y="240" width="24" height="70" rx="4" fill="url(#chartbar)" opacity="0.8"/>
    <path d="M492 200 L640 200" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  </g>
  <!-- front card: proposal doc -->
  <g transform="rotate(5 260 260)">
    <rect x="130" y="110" width="230" height="290" rx="16" fill="url(#doccard)" stroke="#93c5fd" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="152" y="134" width="44" height="44" rx="10" fill="url(#bluebadge)"/>
    <text x="174" y="165" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">W</text>
    <rect x="210" y="140" width="120" height="14" rx="7" fill="#dbeafe" opacity="0.95"/>
    <rect x="210" y="162" width="86" height="9" rx="4" fill="#93c5fd" opacity="0.6"/>
    <g fill="#ffffff">
      <rect x="152" y="205" width="186" height="8" rx="4" opacity="0.35"/>
      <rect x="152" y="223" width="166" height="8" rx="4" opacity="0.28"/>
      <rect x="152" y="241" width="176" height="8" rx="4" opacity="0.32"/>
      <rect x="152" y="259" width="140" height="8" rx="4" opacity="0.24"/>
      <rect x="152" y="291" width="186" height="8" rx="4" opacity="0.32"/>
      <rect x="152" y="309" width="158" height="8" rx="4" opacity="0.26"/>
      <rect x="152" y="327" width="172" height="8" rx="4" opacity="0.3"/>
    </g>
    <rect x="152" y="356" width="92" height="24" rx="12" fill="url(#bluebadge)" opacity="0.95"/>
  </g>
  <!-- floating pen cursor -->
  <g transform="rotate(-30 415 330)">
    <rect x="405" y="290" width="14" height="70" rx="6" fill="#f472b6"/>
    <path d="M405 360 L412 382 L419 360 Z" fill="#fbcfe8"/>
  </g>
  <!-- sparkle: AI writing -->
  <g fill="#e9d5ff">
    <path d="M400 95 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 Z" opacity="0.95"/>
    <path d="M96 300 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z" opacity="0.6"/>
    <path d="M700 400 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z" opacity="0.7"/>
  </g>
  <circle cx="700" cy="90" r="4" fill="#a78bfa" opacity="0.8"/>
  <circle cx="80" cy="120" r="3" fill="#93c5fd" opacity="0.7"/>
</svg>
