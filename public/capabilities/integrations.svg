<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="intglow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hubx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="spoke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#071410"/>
  <ellipse cx="400" cy="250" rx="360" ry="240" fill="url(#intglow)"/>
  <!-- spokes -->
  <g fill="none" stroke="url(#spoke)" stroke-width="3.5">
    <path d="M400 250 C310 250 250 180 185 150"/>
    <path d="M400 250 C310 250 250 320 185 350"/>
    <path d="M400 250 C490 250 550 180 615 150"/>
    <path d="M400 250 C490 250 550 320 615 350"/>
    <path d="M400 250 C400 160 400 130 400 95"/>
  </g>
  <circle cx="292" cy="212" r="5.5" fill="#a7f3d0"/>
  <circle cx="512" cy="290" r="5.5" fill="#a7f3d0"/>
  <circle cx="400" cy="160" r="5.5" fill="#a7f3d0"/>
  <!-- central hub with X -->
  <g>
    <circle cx="400" cy="250" r="58" fill="url(#hubx)"/>
    <circle cx="400" cy="250" r="58" fill="none" stroke="#ecfdf5" stroke-opacity="0.5" stroke-width="3"/>
    <g stroke="#022c22" stroke-width="18" stroke-linecap="round">
      <path d="M375 225 L425 275"/>
      <path d="M425 225 L375 275"/>
    </g>
    <g stroke="#ecfdf5" stroke-width="8" stroke-linecap="round">
      <path d="M375 225 L425 275"/>
      <path d="M425 225 L375 275"/>
    </g>
  </g>
  <!-- Gmail tile -->
  <g>
    <rect x="95" y="100" width="100" height="86" rx="18" fill="url(#tile)" stroke="#f87171" stroke-opacity="0.6" stroke-width="2.5"/>
    <rect x="117" y="126" width="56" height="38" rx="7" fill="none" stroke="#fca5a5" stroke-width="4"/>
    <path d="M117 132 L145 152 L173 132" stroke="#fca5a5" stroke-width="4" fill="none"/>
  </g>
  <!-- Drive tile -->
  <g>
    <rect x="95" y="315" width="100" height="86" rx="18" fill="url(#tile)" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="2.5"/>
    <path d="M131 336 L159 336 L177 368 L163 384 L127 384 L113 368 Z" fill="none" stroke="#fde047" stroke-width="4" stroke-linejoin="round"/>
    <path d="M131 336 L145 360 L113 368" stroke="#fde047" stroke-width="3" fill="none" opacity="0.7"/>
  </g>
  <!-- Calendar tile -->
  <g>
    <rect x="510" y="100" width="100" height="86" rx="18" fill="url(#tile)" stroke="#60a5fa" stroke-opacity="0.6" stroke-width="2.5"/>
    <rect x="530" y="122" width="60" height="48" rx="8" fill="none" stroke="#93c5fd" stroke-width="4"/>
    <path d="M530 138 L590 138" stroke="#93c5fd" stroke-width="3.5"/>
    <path d="M544 116 L544 128 M576 116 L576 128" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
    <text x="560" y="163" font-family="sans-serif" font-size="19" fill="#bfdbfe" text-anchor="middle" font-weight="700">17</text>
  </g>
  <!-- Team tile -->
  <g>
    <rect x="510" y="315" width="100" height="86" rx="18" fill="url(#tile)" stroke="#c084fc" stroke-opacity="0.6" stroke-width="2.5"/>
    <circle cx="545" cy="345" r="11" fill="none" stroke="#d8b4fe" stroke-width="4"/>
    <path d="M528 384 C528 368 562 368 562 384" fill="none" stroke="#d8b4fe" stroke-width="4" stroke-linecap="round"/>
    <circle cx="578" cy="349" r="9" fill="none" stroke="#d8b4fe" stroke-width="3.5"/>
    <path d="M564 382 C566 370 592 370 592 382" fill="none" stroke="#d8b4fe" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- outbox send: paper plane above -->
  <g>
    <circle cx="400" cy="72" r="34" fill="#0b241c" stroke="#6ee7b7" stroke-width="3"/>
    <path d="M385 80 L418 60 L404 88 L398 76 Z" fill="#6ee7b7"/>
  </g>
  <!-- delivered check -->
  <circle cx="680" cy="240" r="20" fill="#22c55e"/>
  <path d="M671 240 L677 247 L690 232" stroke="#f0fdf4" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M120 240 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" fill="#a7f3d0" opacity="0.8"/>
  <circle cx="700" cy="120" r="3" fill="#6ee7b7" opacity="0.7"/>
  <circle cx="710" cy="420" r="4" fill="#34d399" opacity="0.6"/>
</svg>
