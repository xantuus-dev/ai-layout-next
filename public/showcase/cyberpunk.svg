<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="cybersky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0118"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0a0118"/>
    </linearGradient>
    <linearGradient id="neonpink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="neoncyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="citygl" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cybersky)"/>
  <ellipse cx="400" cy="330" rx="380" ry="240" fill="url(#citygl)"/>
  <!-- left buildings -->
  <g>
    <rect x="40" y="130" width="150" height="330" fill="#171338"/>
    <rect x="60" y="150" width="14" height="240" fill="url(#neonpink)" opacity="0.9"/>
    <rect x="120" y="180" width="52" height="70" rx="4" fill="#221a4d" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="146" y="225" font-family="monospace" font-size="34" fill="#a5f3fc" text-anchor="middle">酒</text>
    <rect x="112" y="290" width="66" height="18" rx="3" fill="url(#neoncyan)" opacity="0.85"/>
    <g fill="#facc15" opacity="0.8">
      <rect x="98" y="330" width="10" height="10"/>
      <rect x="118" y="330" width="10" height="10"/>
      <rect x="98" y="352" width="10" height="10"/>
      <rect x="138" y="352" width="10" height="10"/>
      <rect x="118" y="374" width="10" height="10"/>
    </g>
  </g>
  <!-- right buildings -->
  <g>
    <rect x="600" y="100" width="170" height="360" fill="#171338"/>
    <rect x="726" y="130" width="16" height="270" fill="url(#neoncyan)" opacity="0.9"/>
    <rect x="622" y="150" width="58" height="120" rx="4" fill="#221a4d" stroke="#d946ef" stroke-width="2.5"/>
    <text x="651" y="200" font-family="monospace" font-size="34" fill="#f0abfc" text-anchor="middle">ラ</text>
    <text x="651" y="242" font-family="monospace" font-size="34" fill="#f0abfc" text-anchor="middle">メ</text>
    <g fill="#facc15" opacity="0.8">
      <rect x="628" y="300" width="10" height="10"/>
      <rect x="648" y="300" width="10" height="10"/>
      <rect x="668" y="322" width="10" height="10"/>
      <rect x="628" y="344" width="10" height="10"/>
      <rect x="648" y="366" width="10" height="10"/>
    </g>
  </g>
  <!-- distant skyline -->
  <g fill="#131033">
    <rect x="220" y="210" width="60" height="230"/>
    <rect x="300" y="170" width="80" height="270"/>
    <rect x="420" y="190" width="70" height="250"/>
    <rect x="510" y="230" width="60" height="210"/>
  </g>
  <g fill="#818cf8" opacity="0.65">
    <rect x="312" y="190" width="8" height="8"/>
    <rect x="332" y="210" width="8" height="8"/>
    <rect x="352" y="190" width="8" height="8"/>
    <rect x="432" y="210" width="8" height="8"/>
    <rect x="452" y="232" width="8" height="8"/>
    <rect x="232" y="232" width="8" height="8"/>
    <rect x="522" y="252" width="8" height="8"/>
  </g>
  <!-- street -->
  <path d="M0 600 L280 440 L520 440 L800 600 Z" fill="url(#road)"/>
  <path d="M280 440 L520 440" stroke="#d946ef" stroke-width="3" opacity="0.9"/>
  <path d="M0 600 L280 440" stroke="#22d3ee" stroke-width="3" opacity="0.8"/>
  <path d="M800 600 L520 440" stroke="#22d3ee" stroke-width="3" opacity="0.8"/>
  <!-- wet reflections -->
  <g stroke-linecap="round" opacity="0.75">
    <path d="M330 480 L322 560" stroke="#d946ef" stroke-width="7"/>
    <path d="M400 470 L400 590" stroke="#22d3ee" stroke-width="6"/>
    <path d="M470 480 L480 560" stroke="#f0abfc" stroke-width="7"/>
    <path d="M245 520 L235 585" stroke="#818cf8" stroke-width="5"/>
    <path d="M555 520 L567 585" stroke="#facc15" stroke-width="4"/>
  </g>
  <!-- rain -->
  <g stroke="#a5b4fc" stroke-width="2" opacity="0.4" stroke-linecap="round">
    <path d="M110 60 L100 110"/>
    <path d="M260 30 L250 80"/>
    <path d="M410 70 L400 120"/>
    <path d="M560 40 L550 90"/>
    <path d="M700 80 L690 130"/>
    <path d="M180 300 L172 340"/>
    <path d="M480 300 L472 340"/>
  </g>
</svg>
