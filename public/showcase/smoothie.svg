<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="spot" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smoothie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="pour" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9f99d"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#031712"/>
  <ellipse cx="400" cy="270" rx="360" ry="270" fill="url(#spot)"/>
  <!-- studio backdrop ring -->
  <circle cx="400" cy="250" r="185" fill="none" stroke="#6ee7b7" stroke-opacity="0.25" stroke-width="3"/>
  <!-- pour stream -->
  <path d="M398 60 C398 130 388 160 396 235 L412 235 C404 160 414 130 414 60 Z" fill="url(#pour)" opacity="0.95"/>
  <!-- splash -->
  <g fill="none" stroke="#bef264" stroke-linecap="round">
    <path d="M362 250 C348 238 342 226 344 210" stroke-width="6" opacity="0.8"/>
    <path d="M448 252 C464 240 470 226 466 208" stroke-width="6" opacity="0.8"/>
    <path d="M336 268 C320 262 310 252 306 240" stroke-width="4" opacity="0.55"/>
    <path d="M474 270 C492 264 502 254 506 240" stroke-width="4" opacity="0.55"/>
  </g>
  <circle cx="330" cy="196" r="7" fill="#d9f99d" opacity="0.9"/>
  <circle cx="482" cy="188" r="5" fill="#d9f99d" opacity="0.8"/>
  <circle cx="300" cy="232" r="4" fill="#bef264" opacity="0.65"/>
  <circle cx="508" cy="222" r="4" fill="#bef264" opacity="0.65"/>
  <!-- glass -->
  <g>
    <path d="M320 240 L336 470 C337 486 350 494 400 494 C450 494 463 486 464 470 L480 240 Z" fill="url(#smoothie)" opacity="0.92"/>
    <path d="M320 240 L336 470 C337 486 350 494 400 494 C450 494 463 486 464 470 L480 240 Z" fill="url(#glass)"/>
    <ellipse cx="400" cy="240" rx="80" ry="16" fill="#ecfccb" opacity="0.85"/>
    <path d="M320 240 L336 470 C337 486 350 494 400 494 C450 494 463 486 464 470 L480 240" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
    <!-- highlight -->
    <path d="M340 265 L350 452" stroke="#ffffff" stroke-opacity="0.5" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- garnish leaf -->
  <path d="M486 210 C516 190 546 192 560 176 C566 200 544 226 512 228 C500 228 490 220 486 210 Z" fill="#4ade80"/>
  <path d="M490 212 C516 202 538 196 556 180" stroke="#166534" stroke-width="2.5" fill="none"/>
  <!-- table shadow -->
  <ellipse cx="400" cy="512" rx="150" ry="18" fill="#000000" opacity="0.45"/>
  <!-- floating berry accents -->
  <circle cx="235" cy="330" r="14" fill="#a21caf" opacity="0.85"/>
  <circle cx="230" cy="325" r="4" fill="#f0abfc" opacity="0.9"/>
  <circle cx="580" cy="352" r="11" fill="#a21caf" opacity="0.75"/>
  <circle cx="577" cy="348" r="3" fill="#f0abfc" opacity="0.85"/>
</svg>
